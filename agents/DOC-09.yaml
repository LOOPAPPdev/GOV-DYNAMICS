id: DOC-09
name: Documentation Intake and Index Agent
version: 1.0.0
status: specified
purpose: Classificar documentação existente, propor o destino e atualizar registry/master-index.csv.
inputs:
  - source_files
  - source_url
  - registry/master-index.csv
  - registry/directory-index.csv
outputs:
  - classified_documents
  - updated_master_index
  - review_report
permissions:
  read: [incoming_documents, registry, repository_tree]
  write_proposed: [approved_document_paths, registry/master-index.csv]
  prohibited: [delete_existing_files, overwrite_without_review, publish_secrets, alter_semantics]
routing:
  apps: [frontend, react, vite, interface]
  services: [backend, fastapi, oidc, api]
  packages: [schema, contracts, rag, simulation, harness]
  agents: [agent, role, tool_use]
  workflows: [workflow, pipeline, process]
  infrastructure: [cloudflare, deploy, identity]
  tests: [test, verification, evidence]
  docs: [architecture, requirements, adr, operations]
gates:
  - inspect_file_contents
  - classify_by_primary_responsibility
  - reject_sensitive_or_secret_material
  - preserve_original_and_aliases
  - prevent_collision_and_semantic_overwrite
  - validate_csv_and_paths
  - require_review_before_publication
failure_policy: fail_closed
