name: Governance documentation validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned YAML validator
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate registry, agent IDs and workflow references
        run: python scripts/validate_registry.py
      - name: Validate master index
        run: python scripts/validate_master_index.py
      - name: Run regression tests
        run: python -m unittest discover -s tests/unit -p 'test_registry_validation.py' -v
