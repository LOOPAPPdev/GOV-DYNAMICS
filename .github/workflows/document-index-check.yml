name: Validate governance document index

on:
  pull_request:
    paths:
      - 'registry/master-index.csv'
      - 'docs/**'
      - 'agents/**'
      - 'workflows/**'
      - 'scripts/validate_master_index.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check master index
        run: python scripts/validate_master_index.py
